services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: book-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "14330:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:                                    # ← ВНУТРИ db, на уровне image/ports
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrongPassword123! -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  api:
    build: .
    container_name: book-api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=BookWiseDB;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;

volumes:
  sql-data: